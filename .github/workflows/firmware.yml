name: Firmware
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      release_tag:
        required: false
        type: string
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: catalog
        run: echo "matrix=$(python3 tools/board_profiles.py matrix)" >> "$GITHUB_OUTPUT"
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake -S tests/host -B build-host && cmake --build build-host -j2
      - run: ctest --test-dir build-host --output-on-failure
      - run: python3 -m unittest discover -s tests/release -v
  esp32p4:
    needs: profiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install build Python dependencies
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r tools/requirements-build.txt
      - name: Build P4 profile and verify partition capacity
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/build_profile.py --profile '${{ matrix.profile }}'
      - name: Package production OTA and factory images
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BOARD_PROFILE: ${{ matrix.profile }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 tools/package_release.py --build "build/profiles/$BOARD_PROFILE/production" --output dist --profile "$BOARD_PROFILE" --tag "$RELEASE_TAG"
          else
            python3 tools/package_release.py --build "build/profiles/$BOARD_PROFILE/production" --output dist --profile "$BOARD_PROFILE"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: dist/*
          if-no-files-found: error
