name: Release development firmware
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-release-dev
  cancel-in-progress: false
jobs:
  identify:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: identity
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          version = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tag = f'dev-v{version}-{os.environ["RUN_NUMBER"]}-{sha[:12]}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nsha={sha}\n')
          PY
  build:
    needs: identify
    uses: ./.github/workflows/firmware.yml
    with:
      ref: ${{ needs.identify.outputs.sha }}
      release_tag: ${{ needs.identify.outputs.tag }}
  publish:
    needs: [identify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c checksums-*.txt
      - name: Publish immutable development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identify.outputs.tag }}
          RELEASE_SHA: ${{ needs.identify.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" \
            --title "Nyx Panel $RELEASE_TAG" --generate-notes --prerelease --latest=false
